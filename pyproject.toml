[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suitediet"
version = "0.1.0"
description = "Suite dieting with a safety proof, ranking tests by measured value and shipping every removal with its evidence and a reversible quarantine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
suitediet = "suitediet.cli:main"

[tool.setuptools.packages.find]
include = ["suitediet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
